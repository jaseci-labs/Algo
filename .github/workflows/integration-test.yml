# Integration Tests for Algo
# Runs full-stack tests on every PR to main, push to main, and every 6 hours
# This prevents breaking changes from being merged and catches upstream Jaseci issues

name: Integration Tests

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # Runs at 00:00, 06:00, 12:00, 18:00 UTC daily
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      jac_release:
        description: 'jaseci release tag to test against (dev = rolling build of main)'
        required: false
        default: 'dev'

permissions:
  contents: read

jobs:
  integration-test:
    name: Full-stack Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Python is only for the HTTP test runner (tests/integration/run_tests.py),
      # which talks to the server over HTTP. It is independent of the jac binary.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/integration/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # jaclang ships as a self-contained native binary (bundled CPython + bun),
      # not a pip package, so `pip install -e .../jac` no longer produces a working
      # `jac`. The `dev` release is a prebuilt rolling build of main -- download it
      # directly (seconds) instead of cloning + compiling jaseci from source.
      - name: Install jac binary (prebuilt dev build of main)
        env:
          JAC_RELEASE: ${{ github.event.inputs.jac_release || 'dev' }}
        run: |
          set -euo pipefail
          ASSET="jac-${JAC_RELEASE}-linux-x86_64"
          BASE="https://github.com/jaseci-labs/jaseci/releases/download/${JAC_RELEASE}"
          mkdir -p "$HOME/.jacbin"
          cd "$HOME/.jacbin"
          echo "Downloading ${ASSET} from ${BASE}..."
          curl -fsSL -o "${ASSET}" "${BASE}/${ASSET}"
          curl -fsSL -o "${ASSET}.sha256" "${BASE}/${ASSET}.sha256"
          sha256sum -c "${ASSET}.sha256"
          mv "${ASSET}" jac
          chmod +x jac
          echo "$HOME/.jacbin" >> "$GITHUB_PATH"

      # The binary bundles jaclang (incl. the folded-in client + byllm + scale),
      # but the heavy runtime capability closures install separately. Pins mirror
      # jac/jaclang/project/capabilities.jac.
      - name: Install serve capability deps (for `jac start`)
        run: |
          jac install \
            "fastapi>=0.121.3,<0.122.0" "uvicorn[standard]>=0.38.0,<0.39.0" \
            "pyjwt>=2.10.1,<2.11.0" "fastapi-sso>=0.21.0,<1.0.0" \
            "python-multipart>=0.0.21,<1.0.0" "bcrypt>=4.0.0,<5.0.0" \
            "aiohttp>=3.9.0,<4.0.0" "sqlalchemy>=2.0.0,<3.0.0" \
            "email-validator>=2.3.0,<3.0.0" "python-dotenv>=1.2.1,<2.0.0" \
            "requests>=2.32.0,<3.0.0" \
            --global

      - name: Install byllm capability deps (for `by llm()`)
        run: |
          jac install \
            "litellm>=1.70.0,<=1.82.6" "pillow>=12.0.0,<13.0.0" \
            "httpx>=0.27.0" "loguru>=0.7.2,<0.8.0" \
            --global

      - name: Install app dependencies
        run: jac install

      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Verify installation
        run: |
          echo "=== Jac Version ==="
          jac --version
          echo "=== Plugins ==="
          jac plugins list
          JAC_VERSION="$(jac --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "JAC_VERSION=${JAC_VERSION:-unknown}" >> "$GITHUB_ENV"

      - name: Run jac check
        run: jac check main.jac

      - name: Start Jac server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Starting Jac server..."
          timeout 600 jac start main.jac > /tmp/jac_server.log 2>&1 &
          JAC_PID=$!
          echo "Jac server PID: $JAC_PID"
          echo $JAC_PID > /tmp/jac_pid.txt
          sleep 10
          if ! kill -0 $JAC_PID 2>/dev/null; then
            echo "Server process died during startup"
            cat /tmp/jac_server.log
            exit 1
          fi

      - name: Wait for server
        run: |
          echo "Waiting for server to start..."
          for i in $(seq 1 60); do
            if ! kill -0 "$(cat /tmp/jac_pid.txt)" 2>/dev/null; then
              echo "Server process exited unexpectedly"
              cat /tmp/jac_server.log
              exit 1
            fi
            if curl -sf --max-time 10 http://localhost:8000/app/health > /dev/null 2>&1; then
              echo "Server is ready! (attempt $i)"
              exit 0
            fi
            sleep 5
          done
          echo "Server did not become ready in time"
          echo "=== Server Log ==="
          tail -100 /tmp/jac_server.log
          exit 1

      - name: Show server status
        run: |
          echo "=== Jac Server Status ==="
          cat /tmp/jac_server.log || true
          curl -s http://localhost:8000/ || true

      - name: Run integration tests
        run: python tests/integration/run_tests.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TEST_MODE: ci

      - name: Capture server logs on failure
        if: failure()
        run: |
          echo "=== Server Logs ==="
          cat /tmp/jac_server.log || true
          echo "=== Process Status ==="
          ps aux | grep jac || true

      - name: Shutdown server
        if: always()
        run: |
          if [ -f /tmp/jac_pid.txt ]; then
            JAC_PID=$(cat /tmp/jac_pid.txt)
            kill $JAC_PID 2>/dev/null || true
            echo "Killed Jac server (PID: $JAC_PID)"
          fi
          pkill -f "jac start" 2>/dev/null || true

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jac-server-logs
          path: /tmp/jac_server.log
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          echo "## Algo Integration Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Jac version** | \`${{ env.JAC_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **jac release** | \`${{ github.event.inputs.jac_release || 'dev' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
